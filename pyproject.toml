[project]
name = "python-telegram-tts-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saeed Payvandi", email = "saeedpayvandi82@gmail.com" }
]
requires-python = ">=3.13"
